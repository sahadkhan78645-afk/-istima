<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>भोपाल इज्तिमा 2026</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:#fff;color:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:420px;width:100%;border:3px solid #000;padding:36px 24px}
  h1{font-size:28px;font-weight:800;line-height:1.3;margin-bottom:10px}
  p{font-size:18px;line-height:1.6;margin-bottom:22px}
  a.btn{display:inline-block;background:#000;color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:14px 28px;border-radius:12px}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="live" class="hide">
    <h1>भोपाल इज्तिमा 2026</h1>
    <p>WhatsApp खुल रहा है…</p>
    <a id="open" class="btn" href="#">WhatsApp खोलें</a>
  </div>
  <div id="over" class="hide">
    <h1>भोपाल इज्तिमा 2026</h1>
    <p>इज्तिमा संपन्न हो चुका है।<br>अब यह QR सक्रिय नहीं है। शुक्रिया।</p>
  </div>
</div>
<script>
  // WhatsApp link (number + ready-made message)
  var WA = "https://wa.me/919926222655?text=" +
           encodeURIComponent("अस्सलामु अलैकुम, मैं भी चलूंगा इंशाअल्लाह");
  // Expiry: 7 December 2026 ke baad (8 Dec 2026, 12:00 AM IST = 7 Dec 18:30 UTC)
  var EXPIRY = Date.UTC(2026, 11, 7, 18, 30, 0);

  if (Date.now() < EXPIRY) {
    document.getElementById("live").className = "";
    document.getElementById("open").href = WA;
    window.location.replace(WA);
  } else {
    document.getElementById("over").className = "";
  }
</script>
</body>
</html>
